<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>브릿지 커피 메뉴판</title>

  <!-- =====================================================================
       ★★★ 메뉴 정보 보관함 (메뉴를 고칠 때는 이 상자 안만 보면 됩니다) ★★★

       이 아래 "메뉴목록" 안의 내용이 화면에 그대로 나타납니다.
       화면 아래쪽의 다른 코드는 건드리지 않으셔도 됩니다.

       ■ 메뉴 하나는 이렇게 생겼어요 (한 줄이 메뉴 하나):
           { 이름: "아메리카노", 가격: 4500, 설명: "산미가 적은 고소한 원두" },

       ■ 가격을 고치고 싶을 때
           가격: 4500  ← 이 숫자만 바꾸세요.
           · 숫자만 쓰세요.  (O) 5000      (X) 5,000   (X) 5000원
           · 쉼표(,)와 '원' 글자는 화면에 자동으로 붙습니다.

       ■ 이름이나 설명을 고치고 싶을 때
           큰따옴표(" ") 안의 글자만 바꾸세요. 따옴표 자체는 지우면 안 돼요!

       ■ 메뉴를 새로 추가하고 싶을 때
           1) 추가하고 싶은 칸(커피 / 논커피 / 디저트)을 찾아요.
           2) 그 칸 안에서 메뉴 한 줄을 통째로 복사해요.
           3) 같은 칸 안, 닫는 대괄호 ] 바로 위에 붙여넣어요.
           4) 이름·가격·설명을 바꿔요.
           ※ 줄 끝의 쉼표(,)를 꼭 남겨두세요!

       ■ 메뉴를 지우고 싶을 때
           지우고 싶은 메뉴 "한 줄"을 통째로 지우세요. (다른 줄은 건드리지 마세요)

       ■ '대표' 표시(작은 크림색 알약 모양 글씨)를 붙이고 싶을 때
           줄 끝에 이렇게 추가하세요:
           { 이름: "아메리카노", 가격: 4500, 설명: "...", 대표: true },
           빼고 싶으면 , 대표: true 부분만 지우세요.

       ■ 새 칸(예: "샌드위치")을 만들고 싶을 때
           아래 칸 하나(  { 칸이름: ... },  )를 통째로 복사해서
           맨 아래 칸 뒤에 붙여넣고, 칸이름과 메뉴 줄을 바꾸세요.

       ■ 칸이나 메뉴의 순서를 바꾸고 싶을 때
           줄을 잘라내서(Ctrl+X) 원하는 위치에 붙여넣으세요(Ctrl+V).

       ■ 이것만 조심하세요
           · 따옴표(" "), 중괄호({ }), 대괄호([ ]), 쉼표(,)를 지우지 마세요.
           · 고친 뒤 화면이 하얗게 나오면 괄호나 쉼표가 빠진 거예요.
             Ctrl+Z로 되돌린 뒤 다시 해보세요.
       ===================================================================== -->
  <script>
    const 메뉴목록 = [

      // ───────── 첫 번째 칸: 커피 ─────────
      {
        칸이름: "커피",
        메뉴: [
          { 이름: "아메리카노",        가격: 4800, 설명: "산미가 적은 고소한 원두" },
          { 이름: "카페라떼",          가격: 5000, 설명: "부드러운 우유 거품" },
          { 이름: "바닐라 라떼",       가격: 5500, 설명: "바닐라빈을 직접 우려낸 시럽" },
          { 이름: "아인슈페너",        가격: 5800, 설명: "단맛을 줄인 수제 크림", 대표: true },
          { 이름: "콜드브루",          가격: 5300, 설명: "12시간 저온 추출, 목넘김이 깔끔함" },
          { 이름: "디카페인 아메리카노", 가격: 5000, 설명: "카페인 걱정 없이 편하게" },
          // ↑ 커피 메뉴를 추가하려면 이 줄 바로 위에 한 줄을 붙여넣으세요.
        ]
      },

      // ───────── 두 번째 칸: 논커피 ─────────
      {
        칸이름: "논커피",
        메뉴: [
          { 이름: "흑임자 라떼", 가격: 5500, 설명: "국산 흑임자를 직접 갈아 넣음", 대표: true },
          { 이름: "말차 라떼",   가격: 5800, 설명: "우지 말차, 쌉쌀한 맛이 진함" },
          { 이름: "쑥 라떼",     가격: 5500, 설명: "강화도 쑥, 은은하고 담백함" },
          { 이름: "곡물 라떼",   가격: 5300, 설명: "볶은 곡물의 구수한 맛" },
          { 이름: "자몽에이드",  가격: 6000, 설명: "생과일 자몽 과육을 그대로" },
          // ↑ 논커피 메뉴를 추가하려면 이 줄 바로 위에 한 줄을 붙여넣으세요.
        ]
      },

      // ───────── 세 번째 칸: 디저트 ─────────
      {
        칸이름: "디저트",
        메뉴: [
          { 이름: "치즈케이크",       가격: 6500, 설명: "굽지 않은 부드러운 식감" },
          { 이름: "당근케이크",       가격: 6000, 설명: "견과류를 넉넉히 넣음" },
          { 이름: "스콘",             가격: 4000, 설명: "겉은 바삭 속은 촉촉, 잼과 함께" },
          { 이름: "바스크 치즈케이크", 가격: 6800, 설명: "겉면을 진하게 태운 풍미" },
          // ↑ 디저트 메뉴를 추가하려면 이 줄 바로 위에 한 줄을 붙여넣으세요.
        ]
      },

      // ↑ 새 칸을 만들려면 이 줄 바로 위에 칸 하나를 통째로 붙여넣으세요.
    ];
  </script>
  <!-- ★★★ 메뉴 정보 보관함 끝 ★★★ -->

  <style>
    /* ===== 색깔 (바꾸고 싶으면 여기 숫자만 고치세요) ===== */
    :root {
      --짙은갈색: #4A3728;   /* 배경, 제목 */
      --크림색: #F5EFE6;     /* 카드, 본문 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* 글꼴: 고운 돋움 먼저, 없으면 맑은 고딕 */
      font-family: "고운 돋움", "GowunDodum", "Gowun Dodum", "맑은 고딕", "Malgun Gothic", sans-serif;
      background: var(--짙은갈색);
      /* 배경에 은은한 빛 번짐 (유리 카드가 예쁘게 보이도록) */
      background-image:
        radial-gradient(circle at 15% 10%, rgba(245, 239, 230, 0.16), transparent 45%),
        radial-gradient(circle at 90% 60%, rgba(245, 239, 230, 0.10), transparent 50%);
      background-attachment: fixed;
      color: var(--크림색);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* 휴대폰 폭(390px) 기준 */
    .화면 {
      max-width: 390px;
      margin: 0 auto;
      padding: 32px 18px 40px;
    }

    /* 유리 카드 (반투명 + 부드러운 그림자 + 둥근 모서리) */
    .카드 {
      background: rgba(245, 239, 230, 0.14);
      border: 1px solid rgba(245, 239, 230, 0.28);
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 18px 20px;
    }

    /* ===== 맨 위: 가게 이름 ===== */
    .맨위 { text-align: center; padding: 8px 0 28px; }
    .맨위 h1 { font-size: 30px; letter-spacing: 1px; }
    .소개 { margin-top: 8px; font-size: 15px; opacity: 0.9; }
    .위치 { margin-top: 4px; font-size: 13px; opacity: 0.7; }

    /* ===== 카테고리 버튼 (화면 위쪽, 스크롤해도 따라옴) ===== */
    .분류버튼들 {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      margin: 0 -18px;
      padding: 10px 18px;
      overflow-x: auto;                       /* 칸이 많아지면 옆으로 밀어서 볼 수 있음 */
      background: rgba(74, 55, 40, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .분류버튼 {
      flex: 1 0 auto;
      min-height: 48px;                       /* 손가락으로 누르기 편한 높이 (바꾸려면 이 숫자) */
      padding: 0 18px;
      font-family: inherit;
      font-size: 16px;
      color: var(--크림색);
      background: rgba(245, 239, 230, 0.14);
      border: 1px solid rgba(245, 239, 230, 0.28);
      border-radius: 999px;
      cursor: pointer;
    }
    /* 지금 선택된 버튼: 색이 다르게 */
    .분류버튼.선택됨 {
      color: var(--짙은갈색);
      background: var(--크림색);
      font-weight: bold;
    }

    /* ===== 가운데: 메뉴 ===== */
    .분류제목 {
      font-size: 17px;
      margin: 26px 4px 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(245, 239, 230, 0.3);
    }
    .메뉴 { margin-bottom: 12px; }
    .메뉴줄 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .메뉴이름 { font-size: 17px; font-weight: bold; }
    .가격 { font-size: 16px; white-space: nowrap; }
    .설명 { margin-top: 4px; font-size: 13.5px; opacity: 0.8; }
    .대표 {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: normal;
      color: var(--짙은갈색);
      background: var(--크림색);
      border-radius: 999px;
      vertical-align: middle;
    }

    /* ===== 맨 아래: 영업시간, 안내, 전화 ===== */
    .아래 { margin-top: 30px; }
    .아래 h2 { font-size: 17px; margin-bottom: 8px; }
    .시간줄 { display: flex; justify-content: space-between; font-size: 14.5px; padding: 3px 0; }
    .휴무 { color: #F0B8A0; }
    .안내 { margin-top: 14px; font-size: 13.5px; opacity: 0.85; }

    .전화버튼 {
      display: block;
      margin-top: 18px;
      padding: 15px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      color: var(--짙은갈색);
      background: var(--크림색);
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="화면">

    <!-- ===== 1. 맨 위: 가게 이름과 한 줄 소개 ===== -->
    <header class="맨위">
      <h1>브릿지 커피</h1>
      <p class="소개">매일 직접 볶는 스페셜티 커피</p>
      <p class="위치">광주 북구 비엔날레</p>
    </header>

    <!-- 카테고리 버튼 자리 (버튼은 맨 위 보관함의 칸이름으로 자동 만들어집니다) -->
    <nav class="분류버튼들" id="분류버튼자리"></nav>

    <!-- ===== 2. 가운데: 메뉴 목록 ===== -->
    <!-- 이 자리에는 파일 맨 위 '메뉴 정보 보관함'의 내용이 자동으로 채워집니다.
         메뉴를 고치려면 여기가 아니라 맨 위 보관함을 고치세요. -->
    <main id="메뉴자리"></main>

    <!-- ===== 3. 맨 아래: 영업시간과 전화 걸기 ===== -->
    <footer class="카드 아래">
      <h2>영업시간</h2>
      <div class="시간줄"><span>평일</span><span>08:00 - 21:00</span></div>
      <div class="시간줄"><span>주말</span><span>10:00 - 20:00</span></div>
      <div class="시간줄"><span>목요일</span><span class="휴무">휴무</span></div>

      <p class="안내">주차 2대 가능 · 인스타 @bridge_coffee · 1인 좌석 6석</p>

      <!-- 전화번호를 바꾸려면 아래 두 곳의 번호를 같이 고치세요 (href 안의 번호, 화면 글자) -->
      <a class="전화버튼" href="tel:062-000-0000">📞 전화 걸기</a>
    </footer>

  </div>

  <!-- ===== 아래는 보관함의 메뉴를 화면에 그려주는 기계입니다. 고치지 않으셔도 돼요. ===== -->
  <script>
    const 자리 = document.getElementById("메뉴자리");
    const 버튼자리 = document.getElementById("분류버튼자리");

    // 버튼 만들기: '전체' + 보관함의 칸이름들(커피, 논커피, 디저트...)
    // 보관함에 새 칸을 만들면 버튼도 자동으로 하나 늘어납니다.
    const 버튼이름들 = ["전체"].concat(메뉴목록.map(function (칸) { return 칸.칸이름; }));
    버튼이름들.forEach(function (이름) {
      const 버튼 = document.createElement("button");
      버튼.type = "button";
      버튼.className = "분류버튼";
      버튼.textContent = 이름;
      버튼.addEventListener("click", function () { 그리기(이름); });
      버튼자리.appendChild(버튼);
    });

    // 선택한 칸의 메뉴만 화면에 그리기 ("전체"면 모두)
    function 그리기(선택) {
      자리.innerHTML = "";

      // 선택된 버튼만 색을 다르게
      버튼자리.querySelectorAll(".분류버튼").forEach(function (버튼) {
        버튼.classList.toggle("선택됨", 버튼.textContent === 선택);
      });

    메뉴목록.forEach(function (칸) {
      if (선택 !== "전체" && 선택 !== 칸.칸이름) return;   // 선택하지 않은 칸은 건너뜀

      // 칸 제목 (예: 커피)
      const 제목 = document.createElement("h2");
      제목.className = "분류제목";
      제목.textContent = 칸.칸이름;
      자리.appendChild(제목);

      // 칸 안의 메뉴들
      칸.메뉴.forEach(function (메뉴) {
        const 카드 = document.createElement("div");
        카드.className = "카드 메뉴";

        const 줄 = document.createElement("div");
        줄.className = "메뉴줄";

        const 이름 = document.createElement("span");
        이름.className = "메뉴이름";
        이름.textContent = 메뉴.이름;
        if (메뉴.대표) {
          const 표시 = document.createElement("span");
          표시.className = "대표";
          표시.textContent = "대표";
          이름.appendChild(표시);
        }

        const 가격 = document.createElement("span");
        가격.className = "가격";
        가격.textContent = 메뉴.가격.toLocaleString("ko-KR") + "원"; // 4500 → 4,500원

        const 설명 = document.createElement("p");
        설명.className = "설명";
        설명.textContent = 메뉴.설명;

        줄.appendChild(이름);
        줄.appendChild(가격);
        카드.appendChild(줄);
        카드.appendChild(설명);
        자리.appendChild(카드);
      });
    });
    }

    그리기("전체");   // 처음 들어오면 '전체'가 선택된 상태
  </script>
</body>
</html>
